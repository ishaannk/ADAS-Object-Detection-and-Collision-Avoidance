[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adas"
version = "0.1.0"
description = "Calibrated camera-LIDAR fusion, tracking, and collision-risk assessment on KITTI"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "ultralytics",
    "opencv-python-headless",
    "numpy",
    "scipy",
    "pandas",
    "pyyaml",
    "tqdm",
    "huggingface_hub",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
serve = ["fastapi", "uvicorn[standard]", "python-multipart", "onnxruntime"]

[tool.setuptools.packages.find]
where = ["src"]
